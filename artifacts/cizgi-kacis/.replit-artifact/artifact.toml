kind = "mobile"
previewPath = "/"
title = "Çizgi Kaçış"
description = "iOS ve Android için üstten bakışlı bir refleks oyunu. Oyuncu taşı yön ve hız seçerek çizgilerle dolu fayanslı alanda ilerletir; çarpışmalardan kaçınarak bölümleri tamamlar."
version = "1.0.0"
id = "artifacts/cizgi-kacis"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24022

[services.development]
run = "pnpm --filter @workspace/cizgi-kacis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cizgi-kacis", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cizgi-kacis", "run", "serve" ]

[services.env]
PORT = "24022"
BASE_PATH = "/"
